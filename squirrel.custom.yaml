# squirrel.custom.yaml — Dracula (Squirrel/macOS) tuned to match your Weasel setup
# - Light scheme in light mode, Dracula in dark mode
# - Uses the adjusted hilited candidate background (Purple) instead of the default Pink
#
# Install:
#   Save as: ~/Library/Rime/squirrel.custom.yaml
#   Then "Redeploy" (重新部署)

patch:
  app_options:
    com.apple.Terminal:
      no_inline: false
      inline: true
    com.googlecode.iterm2:
      no_inline: false
      inline: true
    org.wezfurlong.wezterm:
      no_inline: false
      inline: true
    io.alacritty:
      no_inline: false
      inline: true
    net.kovidgoyal.kitty:
      no_inline: false
      inline: true

    org.gnu.Emacs:
      no_inline: false
      inline: true
    org.vim.MacVim:
      no_inline: false
      inline: true
    com.qvacua.VimR:
      no_inline: false
      inline: true

    com.sublimetext.2:
      no_inline: false
      inline: true
    com.sublimetext.3:
      no_inline: false
      inline: true
    com.macromates.TextMate:
      no_inline: false
      inline: true
  style:
    # Follow system appearance (light/dark)
    color_scheme: dracula_light
    color_scheme_dark: dracula

    # Modern Squirrel layout knobs
    candidate_list_layout: linear
    text_orientation: horizontal

    # (Compat for older configs; harmless if ignored)
    horizontal: true

    inline_preedit: true

    # Typography
    font_name: "PingFang SC, STSong, Songti SC"
    label_font_name: "PingFang SC, STSong"
    comment_font_name: "PingFang SC, STSong"
    font_point: 16
    label_font_point: 14
    comment_font_point: 14

    # Candidate display format (no trailing space to avoid “extra tail”)
    candidate_format: "%c %@"

    # Rounded, closer to macOS feel
    corner_radius: 10
    hilited_corner_radius: 8
    border_height: 2
    border_width: 2

  preset_color_schemes:
    dracula:
      name: "Dracula"
      author: "Dracula Theme (tuned)"

      back_color: 0x362A28
      border_color: 0x362A28
      text_color: 0x6CB8FF

      hilited_text_color: 0x5A4744
      hilited_back_color: 0xF2F8F8

      candidate_text_color: 0xF993BD
      comment_text_color: 0xFDE98B

      # Highlight (adjusted): Purple (#BD93F9) in Weasel ABGR => 0xF993BD
      hilited_candidate_label_color: 0xFAFAFA
      hilited_candidate_text_color: 0xF2F8F8
      hilited_candidate_back_color: 0xF993BD
      hilited_comment_text_color: 0x362B00

    dracula_light:
      name: "Dracula Light"
      author: "Dracula Theme (tuned)"

      back_color: 0xF2F8F8
      border_color: 0xF2F8F8
      text_color: 0x362A28

      hilited_text_color: 0x362A28
      hilited_back_color: 0xF2F8F8

      candidate_text_color: 0x362A28
      comment_text_color: 0x5A4744

      # Keep the same highlight color for consistency across macOS/Windows
      hilited_candidate_label_color: 0xF2F8F8
      hilited_candidate_text_color: 0xF2F8F8
      hilited_candidate_back_color: 0xF993BD
      hilited_comment_text_color: 0x362B00
