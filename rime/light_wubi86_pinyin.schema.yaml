# Rime schema
# encoding: utf-8

schema:
  schema_id: light_wubi86_pinyin
  name: Light Wubi 86 Pinyin Aux
  version: "0.1.0-local"
  author:
    - "lightWubi86 project"
  description: |
    Auxiliary pinyin table for Light Wubi 86 reverse lookup.

engine:
  processors:
    - ascii_composer
    - recognizer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: light_wubi86_pinyin
  enable_charset_filter: false
  enable_completion: true
  enable_encoder: false
  enable_sentence: false
  enable_user_dict: false

recognizer:
  import_preset: default
