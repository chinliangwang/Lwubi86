patch:
  # === 候选词数量设置 ===
  menu:
    page_size: 5

  switches:  # 覆写 switches 配置：中英 / 全半角 / 字符集范围 / 中西标点
    - name: ascii_mode
      reset: 0
      states: [ "中", "英" ]

    - name: full_shape
      reset: 0
      states: [ "半", "全" ]

    # 默认开启 GB2312 范围（常用字）过滤
    # reset=1 => 默认显示 states[1]（"常"）
    - name: gb2312
      reset: 1
      states: [ "全", "常" ]

    # ascii_punct=0 => 中文标点映射；ascii_punct=1 => 西文(ASCII)标点直出
    # 注意：states 里含有逗号等分隔符，必须加引号，否则 YAML 可能解析错误
    - name: ascii_punct
      reset: 0
      states: [ "。，", "．，" ]
  
  # 标点符号配置 - 完全覆盖默认配置
  punctuator:
    # 英文标点配置（ascii_punct: true 时使用）
    ascii_punct:
      '~': '~'
      '!': '!'
      '@': '@'
      '#': '#'
      '$': '$'
      '%': '%'
      '^': '^'
      '&': '&'
      '*': '*'
      '(': '('
      ')': ')'
      '-': '-'
      '_': '_'
      '+': '+'
      '=': '='
      '[': '['
      ']': ']'
      '{': '{'
      '}': '}'
      '|': '|'
      ';': ';'
      ':': ':'
      "'": "'"
      '"': '"'
      ',': ','
      '.': '.'
      '/': '/'
      '\': '\'
      '<': '<'
      '>': '>'
      '?': '?'
      '`': '`'
    
    # 中文标点配置（ascii_punct: false 时使用）
    # 半角中文标点
    half_shape:
      '~': '~'
      '!': '！'
      '@': '@'
      '#': '#'
      '$': '￥'
      '%': '%'
      '^': '……'
      '&': '&'
      '*': '*'
      '(': '（'
      ')': '）'
      '-': '-'
      '_': '——'
      '+': '+'
      '=': '='
      '[': '【'
      ']': '】'
      '{': '「'
      '}': '」'
      '|': '|'
      '\': '、'
      ';': '；'
      ':': '：'
      "'": { pair: ["''", "''"] }
      '"': { pair: ['"', '"'] }
      ',': '，'
      '.': '。'
      '/': '/'
      '<': '《'
      '>': '》'
      '?': '？'
      '`': '·'
    
    # 全角中文标点
    full_shape:
      '~': '～'
      '!': '！'
      '@': '＠'
      '#': '＃'
      '$': '￥'
      '%': '％'
      '^': '……'
      '&': '＆'
      '*': '＊'
      '(': '（'
      ')': '）'
      '-': '－'
      '_': '——'
      '+': '＋'
      '=': '＝'
      '[': '【'
      ']': '】'
      '{': '「'
      '}': '」'
      '|': '｜'
      '\': '、'
      ';': '；'
      ':': '：'
      "'": { pair: ["''", "''"] }
      '"': { pair: ['"', '"'] }
      ',': '，'
      '.': '。'
      '/': '／'
      '<': '《'
      '>': '》'
      '?': '？'
      '`': '·'
  
  # 基础输入配置
  speller:
    max_code_length: 4
    auto_select: true        # 四码唯一自动上屏
    auto_clear: max_length   # 空码自动清空

  # 覆写 translator 的部分属性而不是整体替换
  "translator/enable_sentence": false        # 关闭自动造句
  "translator/enable_encoder": false         # 关闭动态造词
  "translator/encode_commit_history": false  # 不记录上屏历史
  "translator/enable_user_dict": false   # 禁用用户词典
  "translator/enable_charset_filter": false   # 禁用字符集过滤
  "translator/enable_completion": true    # 开启自动补全，显示更多候选词
  "translator/comment_format":            # 清除补全编码提示
    - "xform/.*$//"

  # 左 Shift 改为全局中英文切换：
  # 若已有输入编码，则先按英文原样上屏，再切换到英文模式
  # 这样更接近 QQ/微软/搜狗五笔的手感
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Shift_L: commit_code     # 左 Shift 全局切换中英文，并保留已输入字母
      Shift_R: noop
      Control_L: noop
      Control_R: noop
      Caps_Lock: clear         # Caps Lock 清空输入
      Eisu_toggle: clear       # 日文键盘切换键清空输入
  
  # 回车清空编码，分号选第二候选字，单引号选第三候选字
  "key_binder/bindings/+":
    - { when: composing, accept: Return, send: Escape }   # 回车清空编码
    - { when: has_menu, accept: semicolon, send: 2 }      # 分号键选第二候选字
    - { when: has_menu, accept: apostrophe, send: 3 }     # 单引号键选第三候选字
    - { when: always, accept: "Shift+space", toggle: full_shape }
    - { when: always, accept: "Control+period", toggle: ascii_punct }

  "recognizer/patterns/+":  # 一些常见的英文组合，当正则匹配到这些时，都不会生成候选词，而只输入英文
    email: "^[-_.0-9A-Za-z]+@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:|localhost).*$|^[a-z]+[.].+$"
  
    # 把过滤器接入引擎（已关闭编码提示）
  "engine/filters/+":
    # - reverse_lookup_filter@wubi_code_hint   # 编码提示（已关闭）
    - lua_filter@charset_mode_filter          # 字符集过滤

  # 编码提示配置（已关闭）
  # wubi_code_hint:
  #   tags: [ abc ]              # 对正常输入（abc tag）生效
  #   dictionary: wubi86         # 用 wubi86 词典反查编码
  #   overwrite_comment: true    # 覆盖 comment

  # 告诉 Lua 字表相对路径（相对于 Rime 用户目录）
  charset/files:
    gb2312: lua/charset/gb2312.txt
